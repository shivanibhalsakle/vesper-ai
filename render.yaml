# Render Blueprint for the Vesper backend (FastAPI + Celery worker + Celery
# beat). Postgres is intentionally NOT managed here — Render's free Postgres
# is hard-deleted 30+14 days after creation regardless of usage (see
# render.com/docs/free), which isn't viable for anything beyond a short
# trial. The database lives on Neon (or Supabase) instead, a provider with
# a genuinely non-expiring free tier, and is wired in as a plain env var.
#
# One-time setup after this file is pushed to your repo's default branch:
#   1. In the Render dashboard: New -> Blueprint -> select this repo.
#      Render will read this file and propose the services below.
#   2. Before applying, it will prompt for the `sync: false` env vars:
#      DATABASE_URL (your Neon/Supabase connection string — include
#      `?sslmode=require` if the provider doesn't already append it),
#      ANTHROPIC_API_KEY, and OPENAI_API_KEY (the same values as in
#      backend/.env locally).
#   3. After the services are created, for BOTH vesper-backend and
#      vesper-celery-worker (the beat process doesn't send notifications
#      itself, so it doesn't need this): open the service -> Environment ->
#      Secret Files -> add a file named exactly `firebase-service-account.json`
#      with the contents of your Firebase service account key (the same file
#      used locally at backend/firebase-service-account.json). Render mounts
#      it at /etc/secrets/firebase-service-account.json, which is why
#      FIREBASE_CREDENTIALS_PATH below points there.
#   4. Plan names below are set to the free tier as a starting point — check
#      Render's current pricing/plan names before deploying, since these can
#      change.

services:
  - type: redis
    name: vesper-redis
    plan: free
    ipAllowList: []

  - type: web
    name: vesper-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh start.sh
    plan: free
    envVars: &backendEnv
      - key: ENVIRONMENT
        value: production
      # Set manually in the Render dashboard to your Neon connection string
      # (Neon has a genuinely non-expiring free tier, unlike Render's own
      # free Postgres which is hard-deleted 30+14 days after creation).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: vesper-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-service-account.json
      - key: ALLOWED_ORIGINS
        value: https://vesper-ai-37d6f.web.app,https://vesper-ai-37d6f.firebaseapp.com

# Celery worker + beat (notification rescoring) are deliberately not deployed
# yet — Render's free tier doesn't support the "Background Worker" service
