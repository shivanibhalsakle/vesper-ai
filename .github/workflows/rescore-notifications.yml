name: Daily notification rescore

# Replaces the old Celery-beat job — Render's free tier doesn't support
# background workers, so this triggers the same work via a secured HTTP
# endpoint instead. See render.yaml and app/api/internal.py.
on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily, matching the old Celery beat schedule
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  rescore:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rescore endpoint
        run: |
          curl -sf -X POST "https://vesper.shivanibhalsakle.com/internal/rescore-notifications" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_API_SECRET }}"
